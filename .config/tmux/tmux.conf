# Prefix is the default C-b. `set -s` = server option, `set -g` = global option.

# Don't wait after Esc for an Alt/Meta sequence (default 500 ms lags nvim).
set -s escape-time 0

# Pass focus in/out to the active pane (nvim FocusGained/FocusLost, autoread).
set -s focus-events on

# Forward modifier combos like Shift+Enter to programs (needs extkeys below).
set -s extended-keys on

# Let escape sequences tmux doesn't know (image protocols) reach the terminal.
set -g allow-passthrough on

# Click to select, drag borders to resize, scroll enters copy mode.
set -g mouse on

# Scrollback lines per pane; only affects panes created after this is set.
set -g history-limit 50000

# Number windows/panes from 1 to match the keyboard row.
set -g base-index 1
set -g pane-base-index 1

# Close numbering gaps when a window is killed.
set -g renumber-windows on

# Closing a session's last window jumps to another session instead of detaching.
set -g detach-on-destroy off

# OSC 52 clipboard: tmux and programs inside it (nvim over ssh) may write the
# system clipboard. `external` would allow only tmux itself.
set -g set-clipboard on

# Also refresh WAYLAND_DISPLAY in the server env on attach (defaults cover
# DISPLAY, SSH_AUTH_SOCK, ...) so wl-copy keeps working after a new sway login.
set -ga update-environment WAYLAND_DISPLAY

# Status bar redraw interval; 1 s for the seconds in the clock.
set -g status-interval 1

# TERM inside tmux. Must exist as terminfo on ssh targets too:
#   infocmp -x tmux-256color | ssh <host> 'tic -x -'
set -g default-terminal "tmux-256color"

# What the outer terminal (matched on its $TERM) supports beyond terminfo:
#   RGB        24-bit colour
#   usstyle    undercurl / coloured underline (nvim diagnostics)
#   hyperlinks OSC 8 clickable links
#   extkeys    modifier combos like Shift+Enter; needs `extended-keys on`
# Applied when a client attaches, so detach/reattach after changing.
set -as terminal-features ",alacritty:RGB:usstyle:hyperlinks:extkeys,foot:RGB:usstyle:hyperlinks:extkeys"

# Status bar: left shows the session name (default 10 chars truncates it).
set -g status-left-length 20
set -g status-style 'bg=#000000 fg=colour197'
# Working directory of the active pane, then the clock.
set -g status-right-length 80
set -g status-right "#{pane_current_path}  %H:%M:%S"

# Pane borders: heavy lines, active border coloured and marked with arrows.
set -g pane-border-lines heavy
set -g pane-border-indicators both

# Scrollbar on the right of a pane while in copy mode.
set -g pane-scrollbars modal

# Rounded corners on popups (the fzf pickers).
set -g popup-border-lines rounded

# `bind -N "note"` documents a binding; prefix+? lists all notes.
bind -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf sourced'

# Copy mode (prefix+[) with vi keys. copy-command is what copy-pipe* pipes to
# when given no argument; tmux's default mouse drag-select binding uses it too.
set -g copy-command 'wl-copy'
set-window-option -g mode-keys vi
bind -N "Start selection" -T copy-mode-vi v send-keys -X begin-selection
bind -N "Copy selection to clipboard" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Jump between shell prompts; zsh marks them with OSC 133 (see .zshrc).
bind -N "Previous shell prompt" -T copy-mode-vi [ send-keys -X previous-prompt
bind -N "Next shell prompt" -T copy-mode-vi ] send-keys -X next-prompt

# `bind -r` makes a key repeatable for 500 ms without re-pressing the prefix.
# Only used on resize and last-window; on navigation it would swallow the
# next typed h/j/k/l/n/p (e.g. the n in "nvim").
bind -r -N "Last window" ^ last-window
bind -N "Select pane above" k select-pane -U
bind -N "Select pane below" j select-pane -D
bind -N "Select pane left" h select-pane -L
bind -N "Select pane right" l select-pane -R

bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Kill pane without confirmation (default prefix+x asks).
bind -N "Kill pane" q kill-pane

# Rename window from an empty prompt (the default prefills the current name).
bind -N "Rename window" , command-prompt -p "window name:" "rename-window '%%'"
bind -N "Next window" n next-window
bind -N "Previous window" p previous-window

# New window / splits open in the current pane's directory.
bind -N "New window in current path" c new-window -c "#{pane_current_path}"
bind -N "Split left/right in current path" v split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom in current path" u split-window -v -c "#{pane_current_path}"

# fzf popups: s switches between existing sessions, f creates/switches to a
# session for a directory under ~/code or ~/.config. -b runs them in the
# background so tmux doesn't block.
bind -N "Switch session (fzf)" s run-shell -b "~/.local/bin/tmux/tmux-switch-session"
bind -N "Open project session (fzf)" f run-shell -b "~/.local/bin/tmux/tmux-sessionizer"
